[project]
name = "emovision-backend"
version = "1.0.0"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model: tests that load the real model weights (skipped when weights are missing)",
]
filterwarnings = ["ignore::DeprecationWarning:timm.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008"]  # assert in tests; FastAPI's File() default pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
